<!DOCTYPE html>
<html lang="en" data-theme="neon">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>>dr.kb< multiverse — frontgate</title>
<link rel="stylesheet" href="styles/hallway.css" />
<style>
  .vault {
    border: 2px solid var(--border);
    background: radial-gradient(ellipse at center, #1a0505, #000 70%);
    padding: 3rem 4rem;
    text-align: center;
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(92,26,26,0.6), inset 0 0 40px rgba(0,0,0,0.9);
    max-width: 600px;
    width: 92%;
  }
  .sigil { font-size: 1.2rem; letter-spacing: 0.4em; color: #994444; margin-bottom: 2rem; }
  h1 { letter-spacing: 0.25em; margin-bottom: 1rem; }
  .sub {
    font-size: 0.85rem;
    color: #994444;
    margin-bottom: 2.5rem;
    line-height: 1.6;
  }
  .knocker {
    width: 160px;
    height: 160px;
    border: 3px solid #5c1a1a;
    border-radius: 50%;
    margin: 0 auto 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 0.9rem;
    letter-spacing: 0.3em;
    color: #ff4d4d;
    box-shadow: 0 0 0px transparent;
    transition: transform 0.2s, box-shadow 0.7s ease-out;
    position: relative;
  }
  .knocker:hover { transform: scale(1.04); }
  .knocker.hit {
    animation: knockPulse 0.25s ease-out;
  }
  .knocker.glow-1 {
    box-shadow: 0 0 35px #ff4d4d, inset 0 0 22px rgba(255,77,77,0.4);
  }
  .knocker.glow-2 {
    box-shadow: 0 0 70px #ff4d4d, 0 0 110px rgba(255,77,77,0.25), inset 0 0 32px rgba(255,77,77,0.55);
  }
  .knocker.glow-3 {
    box-shadow: 0 0 120px #ff3333, 0 0 220px rgba(255,50,50,0.45), inset 0 0 60px rgba(255,30,30,0.85);
    background: radial-gradient(circle, rgba(255,30,30,0.55) 0%, rgba(180,20,20,0.25) 55%, transparent 70%);
    color: #fff;
  }
  @keyframes knockPulse {
    0% { transform: scale(1); }
    50% { transform: scale(0.88); }
    100% { transform: scale(1); }
  }
  .status {
    min-height: 1.4em;
    font-size: 0.9rem;
    letter-spacing: 0.15em;
    color: #ff4d4d;
  }
  .msg {
    min-height: 2em;
    margin-top: 1rem;
    font-size: 0.85rem;
    color: #994444;
    font-style: italic;
  }
  .meta { margin-top: 2rem; font-size: 0.7rem; color: #994444; letter-spacing: 0.2em; }
  @media (prefers-reduced-motion: reduce) {
    .knocker.hit { animation: none; }
  }
</style>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <!-- knock ritual only — no nav here -->
  <div class="vault" style="position:relative;z-index:1;margin-top:100px">
    <div class="sigil">⛧ >,< ⛧</div>
    <h1>#THE_RITUAL</h1>
    <p class="sub">>> RABBIT-HOLE TO MULTIVERSELIB-COLLECTIVES<br>complete the_ritual. OR STAY OUTSIDE.</p>
    <div class="knocker" id="knocker" role="button" aria-label="Knock to enter">.</div>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="msg" id="msg"></div>
    <div class="meta">INTENT OVER VELOCITY</div>
  </div>
<script src="scripts/frontgate.js"></script>
</body>
</html>
